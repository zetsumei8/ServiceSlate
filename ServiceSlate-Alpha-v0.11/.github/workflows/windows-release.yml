name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being released
        required: true
      rollback_url:
        description: Optional HTTPS URL for the previous signed installer
        required: false
      rollback_sha256:
        description: SHA-256 for the optional rollback installer
        required: false

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          choco install nsis -y --no-progress
      - name: Build standalone application
        shell: pwsh
        run: pyinstaller windows/ServiceSlate.spec --noconfirm --clean
      - name: Import signing certificate when configured
        if: ${{ secrets.WINDOWS_SIGNING_PFX != '' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("signing.pfx", [Convert]::FromBase64String($env:PFX_B64))
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f signing.pfx /p $env:PFX_PASSWORD dist/ServiceSlate/ServiceSlate.exe
      - name: Build installer
        shell: pwsh
        run: makensis /DVERSION=${{ inputs.version }} windows/ServiceSlate.nsi
      - name: Sign installer when configured
        if: ${{ secrets.WINDOWS_SIGNING_PFX != '' }}
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f signing.pfx /p $env:PFX_PASSWORD release/ServiceSlate-Setup-${{ inputs.version }}.exe
      - name: Generate release hashes and update manifest
        shell: pwsh
        run: |
          $installer = "release/ServiceSlate-Setup-${{ inputs.version }}.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $manifest = @{ version = "${{ inputs.version }}"; sha256 = $hash; installer = (Split-Path $installer -Leaf) }
          if ("${{ inputs.rollback_url }}" -and "${{ inputs.rollback_sha256 }}") {
            $manifest.rollback_url = "${{ inputs.rollback_url }}"
            $manifest.rollback_sha256 = "${{ inputs.rollback_sha256 }}".ToLower()
          }
          $manifest | ConvertTo-Json | Set-Content release/update-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ServiceSlate-Windows-${{ inputs.version }}
          path: release/*
