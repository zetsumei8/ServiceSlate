services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serviceslate}
      POSTGRES_USER: ${POSTGRES_USER:-serviceslate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serviceslate} -d ${POSTGRES_DB:-serviceslate}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-serviceslate}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-serviceslate} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/serviceslate;
      exit 0

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SERVICESLATE_DATABASE_URL: postgresql://${POSTGRES_USER:-serviceslate}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-serviceslate}
      SERVICESLATE_DATA_DIR: /data
      SERVICESLATE_PRODUCTION_MODE: "1"
      SERVICESLATE_SECURE_COOKIES: "1"
      SERVICESLATE_HTTPS_REDIRECT: "0"
      SERVICESLATE_ALLOWED_HOSTS: ${SERVICESLATE_DOMAIN},localhost,127.0.0.1
      SERVICESLATE_PUBLIC_BASE_URL: https://${SERVICESLATE_DOMAIN}
      SERVICESLATE_MASTER_KEY: ${SERVICESLATE_MASTER_KEY:?Set SERVICESLATE_MASTER_KEY in .env}
      SERVICESLATE_SESSION_SECRET: ${SERVICESLATE_SESSION_SECRET:?Set SERVICESLATE_SESSION_SECRET in .env}
      SERVICESLATE_REQUIRE_UPLOAD_SCAN: ${SERVICESLATE_REQUIRE_UPLOAD_SCAN:-1}
      SERVICESLATE_DEFAULT_S3_ENDPOINT: http://minio:9000
      SERVICESLATE_DEFAULT_S3_BUCKET: serviceslate
      SERVICESLATE_DEFAULT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-serviceslate}
      SERVICESLATE_DEFAULT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SERVICESLATE_DEFAULT_S3_SYNC_FILES: "1"
      SERVICESLATE_DEFAULT_S3_SYNC_BACKUPS: "0"
    volumes:
      - serviceslate_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  db-backup:
    build:
      context: backup
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-serviceslate}
      POSTGRES_USER: ${POSTGRES_USER:-serviceslate}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-http://minio:9000}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-serviceslate}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-serviceslate}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-change-me}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SERVICESLATE_DOMAIN: ${SERVICESLATE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  serviceslate_data:
  caddy_data:
  caddy_config:
