[project]
name = "serviceslate-alpha"
version = "0.11.0"
description = "Local-first ServiceSlate proof-of-concept"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "cryptography>=45",
  "apprise>=1.10",
  "boto3>=1.40",
  "python-docx>=1.2",
  "openpyxl>=3.1",
  "pypdf>=6.0",
  "msal>=1.33",
  "pyotp>=2.9",
  "psycopg[binary]>=3.2",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "pytest-cov>=6",
  "ruff>=0.12",
  "basedpyright>=1.31",
  "ty>=0.0.1a20",
  "build>=1.2",
]
security = ["bandit>=1.8", "pip-audit>=2.9"]
windows = ["pyinstaller>=6.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
serviceslate = ["static/*"]
